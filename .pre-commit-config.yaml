repos:
    # General file checks
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
          - id: check-added-large-files
            args: ["--maxkb=1024"]
          - id: check-merge-conflict
          - id: check-case-conflict

    # Conventional commits
    - repo: https://github.com/compilerla/conventional-pre-commit
      rev: v4.3.0
      hooks:
          - id: conventional-pre-commit
            stages: [commit-msg]
            args: [--verbose]

    - repo: local
      hooks:
          - id: go-fmt
            name: go fmt
            entry: gofmt -w
            language: system
            files: \.go$

          - id: go-imports
            name: go imports
            entry: goimports -w
            language: system
            files: \*.go$

          - id: go-vet
            name: go vet
            entry: go vet
            language: system
            files: \*.go$
            pass_filenames: false
